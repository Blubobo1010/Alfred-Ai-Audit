name: outlook-drafts
version: 0.1.0
description: "Every new Outlook draft waits for ✅ Invia / ✏️ Modifica / 🗑 Scarta on Telegram before it is sent (Microsoft Graph)."
author: Kimera deployment
kind: standalone
optional_env:
  - MSGRAPH_CLIENT_SECRET   # only without the alfred-m365 certificate
platforms:
  - linux
  - macos
provides_tools:
  - outlook_draft
requires_env:
  - MSGRAPH_TENANT_ID
  - MSGRAPH_CLIENT_ID
  - TELEGRAM_BOT_TOKEN
