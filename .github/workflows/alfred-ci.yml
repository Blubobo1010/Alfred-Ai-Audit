# +Human CI (overlay from alfred-build). Runs on every generated commit: no secrets needed.
name: alfred-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full-suite:
        description: Run the complete pytest suite (eight slices) instead of the brand-sensitive subset
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: alfred-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (guards, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Standard library only: it runs on the runner's own python3 and fails before any toolchain is fetched.
      - name: Brand guard (no Hermes/Nous on user-visible surfaces)
        run: python3 scripts/alfred/guard.py

      # Upstream's own test lane: Python, uv and pnpm at the versions pm/lock.json pins, and the locked
      # project with its dev and test groups in an environment under $RUNNER_TEMP (never inside the
      # checkout: the updater treats a venv in the tree as an "owning install"). It exports HERMES_PYTHON,
      # which scripts/run_tests.sh uses as is; without it the runner would provision a second environment.
      - name: Locked toolchain and test environment
        uses: ./.github/actions/setup-pm
        with:
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'

      # The ruff version pyproject.toml pins (dev group), not whatever is newest today.
      - name: Lint
        run: python -m scripts.code_health.ruff_runner check .

      - name: Brand-sensitive test subset
        if: ${{ !inputs.full-suite }}
        env:
          HERMES_TEST_WORKERS: 4
          HERMES_TEST_FILE_TIMEOUT: 600
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          shopt -s nullglob
          files=(
            tests/hermes_cli/test_banner*.py
            tests/hermes_cli/test_update_channel*.py
            tests/hermes_cli/test_source_release_channels.py
            tests/hermes_cli/test_source_release_probe.py
            tests/hermes_cli/test_source_check.py
            tests/hermes_cli/test_update_fork_sync_identity.py
            tests/hermes_cli/test_update_upstream_prompt_noninteractive.py
            tests/hermes_cli/test_update_inventory.py
            tests/hermes_cli/test_update_stale_dashboard.py
            tests/hermes_cli/test_verify_console_scripts.py
            tests/hermes_cli/test_source_launcher_publication.py
            tests/hermes_cli/test_ensure_windows_bin_launchers.py
            tests/hermes_cli/test_launcher.py
            tests/hermes_cli/test_model_catalog.py
            tests/hermes_cli/test_version_info.py
            tests/hermes_cli/test_config.py
            tests/hermes_cli/test_home_init_soul_symlink.py
            tests/hermes_cli/test_plugin_validate_locales.py
            tests/hermes_cli/test_skin*.py
            tests/hermes_cli/test_cli_*_i18n.py
            tests/agent/test_prompt_builder.py
            tests/agent/test_anthropic_adapter.py
            tests/agent/test_i18n*.py
            tests/agent/test_soul*.py
            tests/gateway/test_platform_adapter_i18n.py
            tests/gateway/test_exec_approval_template.py
            tests/gateway/test_whatsapp_reply_prefix.py
            tests/gateway/test_relay*.py
            tests/scripts/install/*.py
            tests/compat/*.py
            tests/hermes_cli/test_assistant_name.py
            tests/hermes_cli/test_soul_upgrade_plushuman.py
            tests/hermes_cli/test_plushuman_plugins.py
            tests/hermes_cli/test_uninstall_leftovers.py
          )
          scripts/run_tests.sh "${files[@]}" -q

  # The complete upstream suite (about 92k tests in v0.23) takes one runner some four hours, so it runs as
  # eight slices side by side, with upstream's own settings. Some test files pin the upstream names and
  # cannot pass on this tree: a slice fails only on a file KNOWN_TEST_FAILURES.alfred.md does not list.
  full-suite:
    name: Full suite ${{ matrix.slice }}/8
    if: ${{ inputs.full-suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      # Same pinned binary as upstream's test job: the search tools' tests run the real rg.
      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rg --version

      - name: Locked toolchain and test environment
        uses: ./.github/actions/setup-pm
        with:
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'

      # The runner's own exit status is not the verdict (known failures are expected): the next step is.
      - name: Slice ${{ matrix.slice }}/8
        shell: bash
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/8
          HERMES_TEST_FORKSERVER: "1"
          HERMES_TEST_WORKERS: 4
          HERMES_TEST_FILE_TIMEOUT: 600
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: scripts/run_tests.sh -q 2>&1 | tee "$RUNNER_TEMP/suite.log" || true

      - name: No failure outside the known list
        run: python3 scripts/alfred/known_failures.py "$RUNNER_TEMP/suite.log"

  desktop:
    name: Desktop, TUI and dashboard typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Node and pnpm at the versions pm/lock.json pins (the root package.json refuses anything else).
      # `all` rather than `node`: it also exports HERMES_PYTHON, and without one the electron tests'
      # global setup provisions a whole Python environment to find it.
      - name: Locked Node, pnpm and Python
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
      - name: Install workspaces
        uses: ./.github/actions/retry
        with:
          command: just js-install
      - name: Desktop identity sanity
        env:
          HERMES_DESKTOP_VARIANT: bundled
          HERMES_PAYLOAD_TAG: v0.0.1
        run: |
          node -e '
            const id = require("./apps/desktop/product-identity.cjs")
            const cfg = require("./apps/desktop/electron-builder.config.cjs")
            if (!id.appId.endsWith(".alfred-bundled")) throw new Error("appId " + id.appId)
            if (id.cliName !== "plushuman") throw new Error("cliName " + id.cliName)
            if (id.displayName !== "+Human") throw new Error("displayName " + id.displayName)
            if (id.artifactNamePascal !== "AlfredBundled") throw new Error("artifact " + id.artifactNamePascal)
            if (!cfg.mac.publish || cfg.mac.publish[0].provider !== "github") throw new Error("mac.publish " + JSON.stringify(cfg.mac.publish))
            console.log("ok", id.appId, id.displayName, cfg.mac.publish[0])
          '
      - name: TUI build
        run: pnpm --dir ui-tui run build
      - name: Desktop typecheck
        working-directory: apps/desktop
        run: pnpm exec tsc --build
      # tsconfig.json leaves out electron/; the main process has its own project.
      - name: Desktop main-process typecheck
        working-directory: apps/desktop
        run: pnpm exec tsc -p tsconfig.electron.json --noEmit
      # The codemods edit dashboard pages too (ChannelsPage.tsx).
      - name: Dashboard typecheck
        run: pnpm --dir web run typecheck
      - name: Desktop i18n + updater tests
        working-directory: apps/desktop
        run: >-
          pnpm exec vitest run src/i18n/catalog-completeness.test.ts electron/updater/mac-client.test.ts
          electron/updater/mac.test.ts electron/updater/mac-bundle-install.test.ts
