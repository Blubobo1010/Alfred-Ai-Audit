# TRIAL ONLY (throwaway branch): is test_journey_compress_restart_fifo tuned to upstream's prompt size?
# Runs it as is, then with the compression threshold raised to make room for this tree's longer persona.
name: trial-journey

on:
  push:
    branches: ['trial/upstream-0.23.3']
    paths: ['.github/workflows/trial-journey.yml']

permissions:
  contents: read

jobs:
  journey:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Locked toolchain and test environment
        uses: ./.github/actions/setup-pm
        with:
          packages: pnpm
          extras: '["all", "anthropic", "bedrock", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
      - name: Threshold sweep
        shell: bash
        env:
          HERMES_TEST_FORKSERVER: "1"
          HERMES_TEST_FILE_RETRIES: "0"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          f=tests/gateway/test_journey_compress_restart_fifo.py
          cp "$f" "$RUNNER_TEMP/journey.orig"
          for t in 12000 12200 12400 12700 13000 14000; do
            sed "s/'threshold_tokens': 12000/'threshold_tokens': $t/" "$RUNNER_TEMP/journey.orig" > "$f"
            grep -c "'threshold_tokens': $t" "$f"
            if scripts/run_tests.sh "$f" -q > "$RUNNER_TEMP/journey-$t.log" 2>&1; then
              echo "RESULT threshold_tokens=$t PASS"
            else
              echo "RESULT threshold_tokens=$t FAIL"
              grep -a -E "AssertionError|FAILED|passed|failed" "$RUNNER_TEMP/journey-$t.log" | cut -c1-200 | head -n 8
            fi
          done
