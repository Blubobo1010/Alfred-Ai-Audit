# +Human macOS release (overlay from alfred-build).
#
# Trigger: a product tag vX.Y.Z pushed by alfred-build (or manual dispatch with the tag).
# Builds the bundled desktop app on Apple Silicon, signs it with Developer ID, notarizes it and
# publishes DMG + zip + blockmap + latest-mac.yml on the GitHub Release marked "latest", so both
# electron-updater (github provider, see electron-builder.config.cjs mac.publish fallback) and
# `alfred update` (hermes_cli/source_releases.py stable channel) resolve the same release.
#
# Secrets (repository or environment "release-signing"):
#   CSC_LINK            base64 Developer ID Application .p12
#   CSC_KEY_PASSWORD    its password
#   APPLE_API_KEY_P8    App Store Connect API key (.p8 contents) with Developer access
#   APPLE_API_KEY_ID    its key id
#   APPLE_API_ISSUER    its issuer id
name: alfred-release-macos

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (vX.Y.Z)
        required: true
      publish_without_desktop:
        description: Publish the release even if the desktop build is skipped/failed (source-only)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alfred-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::$TAG is not a stable tag"; exit 1; }
          sha="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          git log -1 --format=%B "$sha" | grep -q '^Upstream-Tag: ' || { echo "::error::$TAG was not generated by alfred-build"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  draft-release:
    needs: [verify-tag]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Create the draft release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$(git log -1 --format=%B "${{ needs.verify-tag.outputs.sha }}")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --draft --title "+Human ${{ needs.verify-tag.outputs.version }}" --notes "$notes"
          fi

  build-macos-arm64:
    needs: [verify-tag, draft-release]
    runs-on: macos-15
    environment: release-signing
    timeout-minutes: 360
    env:
      HERMES_DESKTOP_VARIANT: bundled
      HERMES_PAYLOAD_TAG: ${{ inputs.tag || github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - name: Disable Spotlight indexing for DMG staging
        run: sudo mdutil -a -i off || true

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Require signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          missing=()
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -z "${!v}" ] && missing+=("$v")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Write App Store Connect key for notarytool
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        shell: bash
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Select Xcode 26 for the macOS 26 layered icon
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then echo "::error::no Xcode 26 on this runner"; exit 1; fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"

      - name: Resolve the builder toolchain versions
        id: electron-tools
        shell: bash
        run: |
          node -e '
            const l = require("./package-lock.json")
            console.log("eb=" + l.packages["node_modules/electron-builder"].version)
          ' >> "$GITHUB_OUTPUT"

      - name: Restore the electron-builder toolchain cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: eb3-${{ runner.os }}-${{ runner.arch }}-builder-${{ steps.electron-tools.outputs.eb }}

      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop

      - name: Create the release claim tag
        # Upstream's stable preparation requires an annotated attempt ref `rc.<N>-vX.Y.Z` on the release
        # commit (its tagger timestamp becomes the build's release epoch). Local only; never pushed.
        shell: bash
        run: |
          set -euo pipefail
          claim="rc.${GITHUB_RUN_NUMBER}-${HERMES_PAYLOAD_TAG}"
          git config user.name "alfred-release"
          git config user.email "alfred-release@users.noreply.github.com"
          git tag -a "$claim" -m "+Human release attempt ${GITHUB_RUN_NUMBER} for ${HERMES_PAYLOAD_TAG}" "${HERMES_PAYLOAD_TAG}^{commit}"
          echo "RELEASE_CLAIM_TAG=$claim" >> "$GITHUB_ENV"
          echo "RELEASE_CLAIM_OBJECT=$(git rev-parse "refs/tags/$claim")" >> "$GITHUB_ENV"

      - name: Prepare the complete desktop build
        id: prepare
        shell: bash
        run: |
          python3 scripts/bundles/desktop.py --tag "$HERMES_PAYLOAD_TAG" --variant bundled --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python3 -m scripts.ci.desktop_commands "$RUNNER_TEMP/desktop-job/prepared.json"

      - name: Save dependency inputs
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      - name: Build, sign and notarize
        shell: bash
        timeout-minutes: 330
        env:
          DEBUG: 'electron-osx-sign*,electron-notarize*'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          ulimit -n 16384 2>/dev/null || true
          python scripts/bundles/desktop.py --prepared "$RUNNER_TEMP/desktop-job/prepared.json" --variant bundled

      - name: Verify the build is signed and notarized
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo "::error::no packed .app under apps/desktop/release"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --strict --verbose=2 "$app"
            # Notarization itself is asserted by scripts/notarize.mjs (notarytool status Accepted). Stapling
            # the ticket needs api.apple-cloudkit.com, which GitHub's macOS runners lose for hours at a time:
            # give it a few more tries here, then ship unstapled (Gatekeeper fetches the ticket online).
            stapled=0
            for i in 1 2 3 4; do
              if xcrun stapler validate "$app" 2>/dev/null; then stapled=1; break; fi
              echo "staple attempt $i"
              xcrun stapler staple "$app" && { stapled=1; break; }
              sleep 90
            done
            if [ "$stapled" = 1 ]; then
              spctl -a -vv -t exec "$app"
              echo "signed + notarized + stapled: $app"
            else
              echo "::warning::$app is signed and notarized but its ticket could not be stapled (CloudKit unreachable from the runner)"
              spctl -a -vv -t exec "$app" || echo "::warning::spctl could not confirm the ticket online either"
            fi
          done
          test -s apps/desktop/release/latest-mac.yml
          grep -q 'mac-arm64.zip' apps/desktop/release/latest-mac.yml
          ls -la apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.blockmap

      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The app's updater (electron/updater/mac-client.ts) sets channel "stable" at runtime, so it asks
          # for stable-mac.yml; electron-builder only writes latest-mac.yml. Publish both, identical.
          cp apps/desktop/release/latest-mac.yml apps/desktop/release/stable-mac.yml
          gh release upload "$TAG" apps/desktop/release/*.dmg apps/desktop/release/*.zip \
            apps/desktop/release/*.blockmap apps/desktop/release/latest-mac.yml \
            apps/desktop/release/stable-mac.yml --clobber

  publish:
    needs: [verify-tag, draft-release, build-macos-arm64]
    if: ${{ always() && needs.verify-tag.result == 'success' && needs.draft-release.result == 'success' && (needs.build-macos-arm64.result == 'success' || inputs.publish_without_desktop) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-tag.outputs.sha }}
      - name: Publish the release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --prerelease=false --latest
      - name: Smoke-test both updaters' view of the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          [ "$latest" = "$TAG" ] || { echo "::error::releases/latest is $latest, expected $TAG"; exit 1; }
          pip install --quiet uv
          # GitHub's unauthenticated releases/latest can lag the edit by a minute: retry before failing.
          for attempt in 1 2 3 4 5 6; do
            if uv run --frozen --no-dev python - <<EOF
          from hermes_cli.source_releases import resolve_source_release
          tag, sha = resolve_source_release("stable", ["git"], ".")
          assert tag == "$TAG", (tag, sha)
          print("stable channel resolves", tag, sha)
          EOF
            then exit 0; fi
            echo "attempt $attempt: stable channel not resolved yet, retrying in 30s"; sleep 30
          done
          echo "::error::the updater does not resolve $TAG as the stable release"; exit 1
